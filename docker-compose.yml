services:
  turn2sql:
    build: .
    image: turn2sql:latest
    container_name: turn2sql
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - turn2sql-data:/app/data
    environment:
      DATABASE_PATH: /app/data/data.db
      GIN_MODE: release
      # AI：預設 gemini。沒設定金鑰時伺服器端 AI 關閉，使用者仍可自帶金鑰。
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}

volumes:
  turn2sql-data:
